name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-tests:
    name: Commit pipeline tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C app/tests test

  build-3ds:
    name: 3DSX and CIA
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    env:
      MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
      MAKEROM_SHA256: 287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # The real secret and signing code are private; a fresh clone builds with these.
      - name: Use the example config and the signing stub
        run: |
          cp config/client-secret.mk.example config/client-secret.mk
          cp source/security/RequestSigning.cpp.example source/security/RequestSigning.cpp
      - name: Build the 3DSX
        run: make -j"$(nproc)"
      - name: Install makerom
        run: |
          curl -fsSL --retry 3 -o /tmp/makerom.zip "$MAKEROM_URL"
          echo "$MAKEROM_SHA256  /tmp/makerom.zip" | sha256sum -c -
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
      - name: Build the CIA
        run: >
          makerom -f cia -o rebank.cia -rsf packaging/rebank.rsf -target t
          -elf rebank.elf -icon rebank.smdh -banner packaging/icon/banner.bnr -desc app:7
